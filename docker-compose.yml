version: '3.8'

services:
  db:
    image: postgres:16
    container_name: course_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: course_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  api:
    build: .
    container_name: course_api
    ports:
      - "3010:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - app-network
    command: sh -c "npx prisma migrate deploy && npm run dev"

volumes:
  pgdata:

networks:
  app-network:
