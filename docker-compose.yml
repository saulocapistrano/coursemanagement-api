version: '3.8'

services:
  db:
    image: postgres:16
    container_name: course_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: course_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  api:
    build: .
    container_name: course_api
    ports:
      - "3010:3000"
    volumes:
      - .:/app:cached
      - /app/node_modules
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - app-network
    command: >
      sh -c "
        echo 'Waiting for DB to be ready...' &&
        sleep 5 &&
        echo 'Generating Prisma Client...' &&
        npx prisma generate &&
        echo 'Running migrations on DEV database...' &&
        npx prisma migrate deploy &&
        echo 'Running migrations on TEST database...' &&
        npx dotenv-cli -e .env.test -- npx prisma migrate deploy &&
        echo 'Running tests...' &&
        npm test &&
        echo 'Tests passed! Starting server...' &&
        npm run dev
      "

volumes:
  pgdata:

networks:
  app-network: